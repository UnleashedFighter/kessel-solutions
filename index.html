<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile / responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Kessel Solutions | Premium Web Design & Performance Marketing</title>
    <meta
      name="description"
      content="Kessel Solutions builds forward-pushing digital systems that transform your presence: premium web design, conversion-focused development, and performance marketing."
    />
    <meta name="author" content="Kessel Solutions" />

    <!-- Indexing -->
    <meta name="robots" content="index,follow" />

    <!-- Canonical (UPDATE this once your real domain is connected) -->
    <link rel="canonical" href="https://kesselsolutions.netlify.app/" />

    <!-- Favicons (put these files in /public) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Theme color (optional, nice for mobile browser UI) -->
    <meta name="theme-color" content="#0b0f19" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph (social previews) -->
    <meta property="og:title" content="Kessel Solutions | Premium Web Design & Performance Marketing" />
    <meta
      property="og:description"
      content="Premium web design, conversion-focused development, and performance marketing for businesses that want more leads."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kesselsolutions.netlify.app/" />
    <meta property="og:image" content="https://kesselsolutions.netlify.app/og-image.png" />
    <meta property="og:image:alt" content="Kessel Solutions — Premium Web Design & Performance Marketing" />

    <!-- Twitter (X) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kessel Solutions | Premium Web Design & Performance Marketing" />
    <meta
      name="twitter:description"
      content="Premium web design, conversion-focused development, and performance marketing for businesses that want more leads."
    />
    <meta name="twitter:image" content="https://kesselsolutions.netlify.app/og-image.png" />
  </head>

    <div id="root"></div>

</html>
